version: '3.8'

services:
  # Base de datos para n8n
  postgres_n8n:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_N8N_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    networks:
      - bot_network

  # Base de datos para tu backend (separada, buena práctica)
  postgres_backend:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=botadmin
      - POSTGRES_PASSWORD=${POSTGRES_BACKEND_PASSWORD}
      - POSTGRES_DB=bot_manager
    volumes:
      - postgres_backend_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # distinto puerto para no chocar si tenés otro postgres local
    networks:
      - bot_network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_pass
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/Mendoza
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres_n8n
    networks:
      - bot_network

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://botadmin:${POSTGRES_BACKEND_PASSWORD}@postgres_backend:5432/bot_manager
      - N8N_URL=http://n8n:5678
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_backend
    networks:
      - bot_network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_n8n_data:
  postgres_backend_data:
  n8n_data: