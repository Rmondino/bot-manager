version: '3.8'

services:
  # Base de datos para n8n
  postgres_n8n:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_N8N_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    networks:
      - bot_network

  # Base de datos para tu backend (separada, buena práctica)
  postgres_backend:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=botadmin
      - POSTGRES_PASSWORD=${POSTGRES_BACKEND_PASSWORD}
      - POSTGRES_DB=bot_manager
    volumes:
      - postgres_backend_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # distinto puerto para no chocar si tenés otro postgres local
    networks:
      - bot_network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_n8n
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_pass
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/Mendoza
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres_n8n
    networks:
      - bot_network

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://botadmin:${POSTGRES_BACKEND_PASSWORD}@postgres_backend:5432/bot_manager
      - N8N_URL=http://n8n:5678
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_backend
    networks:
      - bot_network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bot_network
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - bot_network

  postgres_evolution:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evopass
      - POSTGRES_DB=evolution_db
    volumes:
      - postgres_evolution_data:/var/lib/postgresql/data
    networks:
      - bot_network

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=evolution_local_key_2024
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evopass@postgres_evolution:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/de7a2ad2-8dcb-4c44-8bdc-b830764612c6
      - WEBHOOK_GLOBAL_EVENTS=messages.upsert
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres_evolution
      - redis
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_n8n_data:
  postgres_backend_data:
  n8n_data:
  evolution_instances:
  postgres_evolution_data: